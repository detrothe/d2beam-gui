<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- Favicon d2beam (Variante B): Träger auf zwei Auflagern mit einer Last, im Stil des blauen App-Icons.
     Ohne Schrift, damit es auch mit 16 px im Browser-Tab lesbar bleibt.
     Rendern: siehe icon-quelle/favicon-erzeugen.sh -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a8ee6"/><stop offset="1" stop-color="#0a347f"/></linearGradient>
  <linearGradient id="metall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#e3e7eb"/><stop offset="1" stop-color="#8e98a4"/></linearGradient>
</defs>
<rect width="64" height="64" rx="12" fill="url(#bg)"/>
<g fill="#ffd21f"><rect x="28" y="8" width="8" height="12"/><path d="M20,19 L44,19 L32,30 z"/></g>
<rect x="5" y="30" width="54" height="11" rx="2" fill="url(#metall)" stroke="#5d6875" stroke-width="1"/>
<g fill="#e3e7eb"><path d="M13,41 L21,55 L5,55 z"/><path d="M51,41 L59,55 L43,55 z"/></g>
</svg>
